name: Deploy API (Function App)

# Builds the read-only Azure Functions API (api/) and deploys it to the
# standalone Function App provisioned by the `infrastructure` repo.
# Auth is OIDC (federated credential) — no publish profile or secrets stored.
#
# Required repo secrets (from the infra OIDC identity):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# Required repo variable:
#   AZURE_FUNCTIONAPP_NAME  - the Function App name from infra outputs

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC federated login
  contents: write   # bump version in api/package.json + push the release tag back to main

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Deploy (and use the prod environment + its secrets) only on main.
    # Push already filters to main; this also blocks workflow_dispatch from other branches.
    if: github.ref == 'refs/heads/main'
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the release commit can rebase/push cleanly

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Per project rule: every API release is a major bump.
      - name: Apply API version bump (major)
        id: ver
        working-directory: api
        run: |
          npm version major --no-git-tag-version >/dev/null
          v="$(node -p "require('./package.json').version")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "API version is now $v"

      - name: Build API
        working-directory: api
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm prune --omit=dev

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: api

      # Persist the bump only after a successful deploy. [skip ci] stops this
      # commit from re-triggering the workflow.
      - name: Commit version bump and tag
        if: success()
        run: |
          v="${{ steps.ver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/package.json
          git commit -m "chore(release): api v$v [skip ci]"
          git pull --rebase origin main
          git tag -a "api-v$v" -m "api v$v"
          git push --follow-tags origin HEAD:main
