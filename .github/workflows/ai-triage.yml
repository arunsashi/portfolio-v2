name: ai-triage

# Monitor / SRE agent — fired by the Azure Monitor alert (via repository_dispatch
# from the alert webhook relay). Investigates, dedupes, opens a Notion bug card,
# and dispatches the Developer.
# client_payload: the Azure alert common-schema JSON.
on:
  repository_dispatch:
    types: [alert-2pct]

permissions:
  contents: read
  issues: write
  actions: write
  id-token: write

jobs:
  triage:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_BOARD_ID: ${{ vars.NOTION_BOARD_ID }}
      # App Insights queried via Azure CLI (OIDC login below) — no API key.
      APPINSIGHTS_NAME: func-arunsudi-prod-ai
      AZURE_RESOURCE_GROUP: rg-portfolio-prod
    steps:
      - uses: actions/checkout@v4

      # Authenticate the runner's az CLI via the existing federated credential
      # (subject repo:<owner>/Portfolio-v2:environment:prod). The agent's az
      # calls reuse this session — no static App Insights key needed.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Compose prompt from playbook
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          {
            echo 'PROMPT<<__EOF__'
            cat docs/agents/monitor.md
            echo ''
            echo 'Azure alert payload:'
            echo "$PAYLOAD"
            echo ''
            echo 'Investigate with the Azure CLI (already logged in): run `az monitor app-insights query --app "$APPINSIGHTS_NAME" -g "$AZURE_RESOURCE_GROUP" --analytics-query "<KQL>"` — e.g. recent failed requests grouped by operation, and exceptions joined to them over the alert window. Dedupe against open Notion cards. If new, open a bug card and dispatch the developer via: gh api repos/${{ github.repository }}/dispatches -f event_type=ai-dev -F client_payload[...]=...'
            echo ''
            echo 'BEFORE FINISHING, write two files at the repo root:'
            echo '1) ./triage-report.html — a self-contained, email-friendly HTML FRAGMENT (inline styles only; NO <html>/<head>/<body> tags). Use a neat card layout with a heading and labelled sections: Summary (one line), Severity, Error signature, Root cause, Affected path/endpoint, Evidence (key log/metric facts as a small list), Action taken (duplicate? card created? dev dispatched?). If you created a Notion card, include a styled link to it. Keep colors subtle and readable in both light and dark mail clients (dark text on light cards).'
            echo '2) ./triage-card-url.txt — just the Notion card URL on one line (or leave the file empty if no card was created).'
            echo 'These are published to the run summary, kept as an artifact, and emailed as rich HTML, so make the report self-contained.'
            echo '__EOF__'
          } >> "$GITHUB_ENV"

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: 'github-actions'
          prompt: ${{ env.PROMPT }}
          claude_args: >-
            --model claude-sonnet-4-6
            --mcp-config .github/agents/mcp.json
            --allowedTools "Read,Write,Grep,Glob,Bash(gh:*),Bash(az:*),Bash(curl:*),mcp__notion"

      # ---- Durable outputs: run summary, artifact, and rich-HTML email ----
      - name: Publish report to the run summary
        if: ${{ always() }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -f triage-report.html ]; then
            { echo "## Triage report"; echo; cat triage-report.html; } >> "$GITHUB_STEP_SUMMARY"
          else
            { echo "## Triage report"; echo; echo "_No triage-report.html was produced — see the agent step log._"; echo; echo "Run: $RUN_URL"; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report artifact
        id: report
        if: ${{ always() && hashFiles('triage-report.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: triage-report
          path: triage-report.html
          retention-days: 30

      - name: Email the report (rich HTML)
        if: ${{ always() }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.CONTACT_EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.CONTACT_EMAIL_FROM }}
          ARTIFACT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then echo "No RESEND_API_KEY — skipping email."; exit 0; fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          CARD_URL="$(head -n1 triage-card-url.txt 2>/dev/null || true)"
          FRAGMENT="$(cat triage-report.html 2>/dev/null || echo '<p>No report was produced. Open the run to see the agent log.</p>')"

          # Links bar: run summary, artifact download, Notion card.
          LINKS="<p style=\"font:14px/1.5 Arial,sans-serif;margin:0 0 12px\">"
          LINKS="${LINKS}<a href=\"${RUN_URL}\" style=\"color:#185fa5;font-weight:bold\">Run &amp; summary</a>"
          if [ -n "$ARTIFACT_URL" ]; then LINKS="${LINKS} &nbsp;&middot;&nbsp; <a href=\"${ARTIFACT_URL}\" style=\"color:#185fa5;font-weight:bold\">Download HTML report</a>"; fi
          if [ -n "$CARD_URL" ]; then LINKS="${LINKS} &nbsp;&middot;&nbsp; <a href=\"${CARD_URL}\" style=\"color:#185fa5;font-weight:bold\">Open Notion card</a>"; fi
          LINKS="${LINKS}</p>"

          HTML="<div style=\"font-family:Arial,Helvetica,sans-serif;color:#1a1a1a;max-width:680px\"><h2 style=\"margin:0 0 4px\">Portfolio triage report</h2>${LINKS}<hr style=\"border:none;border-top:1px solid #ddd\">${FRAGMENT}</div>"

          jq -n \
            --arg from "$EMAIL_FROM" \
            --arg to "$EMAIL_TO" \
            --arg subject "[portfolio] Triage report — $(date -u +%Y-%m-%d\ %H:%MZ)" \
            --arg html "$HTML" \
            '{from:$from, to:$to, subject:$subject, html:$html}' \
          | curl -s -X POST https://api.resend.com/emails \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" \
              -d @- || echo "Email send failed (non-fatal)."
