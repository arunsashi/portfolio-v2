name: ai-dev

# Developer agent — implements one ticket, branches, opens a PR, hands to QA.
# Triggered by the Monitor or the PRD-approval flow via repository_dispatch.
# client_payload: { card_id, type (feature|bugfix|chore|hotfix), summary, notion_url }
on:
  repository_dispatch:
    types: [ai-dev]
  workflow_dispatch:
    inputs:
      type:
        description: branch type (feature|bugfix|chore|hotfix)
        required: true
        default: feature
      summary:
        description: what to build/fix
        required: true
      card_id:
        description: Notion card id (optional)
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  develop:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_BOARD_ID: ${{ vars.NOTION_BOARD_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Compose prompt from playbook
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          WF_TYPE: ${{ github.event.inputs.type }}
          WF_SUMMARY: ${{ github.event.inputs.summary }}
          WF_CARD: ${{ github.event.inputs.card_id }}
        run: |
          {
            echo 'PROMPT<<__EOF__'
            cat docs/agents/developer.md
            echo ''
            echo 'Ticket context (JSON from repository_dispatch, may be empty for manual runs):'
            echo "$PAYLOAD"
            echo "Manual inputs (if present): type=$WF_TYPE summary=$WF_SUMMARY card_id=$WF_CARD"
            echo ''
            echo 'TWO MODES — check the ticket context:'
            echo 'A) If it has "mode":"fix" with a "pr" and "branch": this is a FIX iteration on an existing PR. Check out that branch (git fetch origin <branch> && git checkout <branch>). Read what to fix: run `gh pr checks <pr>` and inspect the failing e2e run (gh run view --log), and read unresolved review comments (gh pr view <pr> --json reviews,comments and gh api .../comments). Make the smallest correct fix, verify (lint/tsc/build), and PUSH to the SAME branch (git push). Do NOT open a new branch or PR. As the LAST step, clear the in-flight guard so the gate can evaluate the new push: `gh pr edit <pr> --remove-label fixing`. Re-running e2e + pr-review happens automatically. Do NOT merge.'
            echo 'B) Otherwise it is a NEW task: create the branch, code it, verify (lint/tsc/build), PUSH to origin (git push -u origin <branch>), open a PR with `gh pr create` (PR body must include the full Notion card URL and "Tracking issue: #N"), then HAND TO QA by labelling the PR: ensure the label exists (gh label create needs-qa --color BFD4F2 --description "Ready for QA e2e" 2>/dev/null || true) and add it (gh pr edit <pr> --add-label needs-qa). Do NOT merge.'
            echo 'Update the Notion card throughout: set it to In progress and record the branch name when you start, then set its PR property to the PR URL once the PR is open — so the branch and PR are both visible on the card.'
            echo 'In the PR body, if the ticket context has an "issue" field, add a line "Tracking issue: #<that number>" so the QA/e2e agent can close it once e2e passes.'
            echo '__EOF__'
          } >> "$GITHUB_ENV"

      # Mint a GitHub App installation token. Unlike GITHUB_TOKEN, events made
      # with an app token DO trigger downstream workflows (e2e / pr-review / qa).
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          allowed_bots: 'github-actions'
          prompt: ${{ env.PROMPT }}
          claude_args: >-
            --model claude-sonnet-4-6
            --mcp-config .github/agents/mcp.json
            --allowedTools "Read,Write,Edit,Grep,Glob,Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(npx:*),mcp__notion"
