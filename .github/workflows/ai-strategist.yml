name: ai-strategist

# Strategist agent — runs weekly (Mon 13:00 UTC) and on manual dispatch.
# Reads metrics + the codebase, opens ONE GitHub issue (label: prd-proposal)
# with ranked PRDs, and emails Arun a notification. Read-only to prod.
on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  strategist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Compose prompt from playbook
        run: |
          {
            echo 'PROMPT<<__EOF__'
            cat docs/agents/strategist.md
            echo ''
            echo "Produce this week's PRD proposal issue now using the gh CLI (gh issue create --label prd-proposal)."
            echo "After creating it, print the issue URL on a line starting with 'ISSUE_URL='."
            echo '__EOF__'
          } >> "$GITHUB_ENV"

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ env.PROMPT }}
          claude_args: >-
            --model claude-sonnet-4-6
            --allowedTools "Read,Grep,Glob,Bash(gh:*)"

      # Email notification via the existing Resend setup (same key the contact
      # form uses). Best-effort: the issue is the source of truth.
      - name: Email Arun
        if: ${{ success() }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.CONTACT_EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.CONTACT_EMAIL_FROM }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then echo "No RESEND_API_KEY — skipping email."; exit 0; fi
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"$EMAIL_FROM\",\"to\":\"$EMAIL_TO\",\"subject\":\"Weekly portfolio PRD proposal is ready\",\"text\":\"The Strategist opened this week's PRD proposal issue on GitHub. Review and reply /approve to start the dev loop.\"}" \
            || echo "Email send failed (non-fatal)."
