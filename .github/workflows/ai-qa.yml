name: ai-qa

# QA / e2e agent — when the Developer labels a PR `needs-qa`, writes Playwright
# e2e specs for the change on the same branch, runs them, and reports a verdict.
# On pass: comments on the tracking issue noting the spec it wrote and signals
# ready for review (the issue is closed later, automatically, after the change
# deploys to production — see close-issue-on-deploy.yml). On fail: QA notes back.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  qa:
    if: ${{ github.event.label.name == 'needs-qa' }}
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_BOARD_ID: ${{ vars.NOTION_BOARD_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Compose prompt from playbook
        run: |
          {
            echo 'PROMPT<<__EOF__'
            cat docs/agents/qa.md
            echo ''
            echo "This is PR #${{ github.event.pull_request.number }} on branch ${{ github.event.pull_request.head.ref }}."
            echo 'Write e2e specs under e2e/ for this change, run `npm run test:e2e`, commit the new specs to this branch, then post your verdict on the PR.'
            echo 'ALWAYS write the Notion card QA notes property (pass or fail): how you tested — spec file(s) added, scenarios/flows covered (happy path, edge cases, a11y checks), the run result with counts, and on failure which specs failed (expected vs actual).'
            echo 'Find the tracking issue this work came from: read the PR body (gh pr view #${{ github.event.pull_request.number }}) for a "Tracking issue: #N" / "Closes #N" reference, or the linked Notion card.'
            echo 'IF e2e PASSES: comment on that tracking issue naming the exact spec file(s) you added and linking this PR. Do NOT close the issue — it is closed automatically after the change deploys to production. IF e2e FAILS: leave QA notes on the PR for the Developer and do NOT approve.'
            echo '__EOF__'
          } >> "$GITHUB_ENV"

      # App token so QA's spec commits re-trigger e2e / pr-review on the PR.
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          # Triggered by the label the app applied in ai-dev, so allow the app bot too.
          allowed_bots: '*'
          prompt: ${{ env.PROMPT }}
          claude_args: >-
            --model claude-sonnet-4-6
            --mcp-config .github/agents/mcp.json
            --allowedTools "Read,Write,Edit,Grep,Glob,Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(npx:*),mcp__notion"
