name: Deploy web (Static Web App)

# Builds the Angular front end and uploads it to Azure Static Web Apps.
# The SWA resource itself is provisioned by the `infrastructure` repo;
# this workflow only ships built assets into it.
#
# Required repo secret:
#   AZURE_STATIC_WEB_APPS_API_TOKEN  - SWA deployment token (from infra outputs)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.postcssrc.json'
      - 'staticwebapp.config.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Deploy (and use the prod environment + its secrets) only on main.
    # Push already filters to main; this also blocks workflow_dispatch from other branches.
    if: github.ref == 'refs/heads/main'
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build -- --configuration production

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          # Pre-built Angular output (the application builder emits to /browser).
          app_location: dist/portfolio/browser
          output_location: ''
          skip_app_build: true
          skip_api_build: true
