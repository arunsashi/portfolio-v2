name: Deploy web (Static Web App)

# Builds the Angular front end and uploads it to Azure Static Web Apps.
# The SWA resource itself is provisioned by the `infrastructure` repo;
# this workflow only ships built assets into it.
#
# Required repo secret:
#   AZURE_STATIC_WEB_APPS_API_TOKEN  - SWA deployment token (from infra outputs)
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID  - OIDC login (to tag the SWA)
#   STATSIG_CLIENT_KEY  - public Statsig client key, injected into the build
# Optional repo variables:
#   AZURE_STATIC_WEB_APP_NAME  - defaults to swa-arunsudi-prod
#   AZURE_RESOURCE_GROUP       - defaults to rg-portfolio-prod

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.postcssrc.json'
      - 'staticwebapp.config.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  id-token: write   # OIDC login so the CLI can tag the SWA resource
  contents: write   # bump version in package.json + push the release tag back to main

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Deploy (and use the prod environment + its secrets) only on main.
    # Push already filters to main; this also blocks workflow_dispatch from other branches.
    if: github.ref == 'refs/heads/main'
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the release commit can rebase/push cleanly

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # UI version bump from the triggering commit message:
      #   major:/overhaul: (or BREAKING CHANGE) -> major   (Angular upgrade / overhaul)
      #   feat:                                  -> minor   (feature)
      #   anything else                          -> patch   (small fix)
      - name: Determine and apply UI version bump
        id: ver
        run: |
          msg="$(git log -1 --pretty=%B)"
          if printf '%s' "$msg" | grep -qiE '^(major|overhaul)(\(.+\))?!?:|breaking change'; then
            bump=major
          elif printf '%s' "$msg" | grep -qiE '^feat(\(.+\))?!?:'; then
            bump=minor
          else
            bump=patch
          fi
          echo "Commit: $msg"
          echo "Bump type: $bump"
          npm version "$bump" --no-git-tag-version >/dev/null
          v="$(node -p "require('./package.json').version")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "UI version is now $v"

      # Inject the public Statsig client key from the secret into the prod
      # environment file. Empty secret -> placeholder cleared -> flags disabled.
      - name: Inject Statsig client key
        env:
          STATSIG_CLIENT_KEY: ${{ secrets.STATSIG_CLIENT_KEY }}
        run: |
          sed -i "s|__STATSIG_CLIENT_KEY__|${STATSIG_CLIENT_KEY}|" src/environments/environment.prod.ts

      - run: npm run build -- --configuration production

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          # Pre-built Angular output (the application builder emits to /browser).
          app_location: dist/portfolio/browser
          output_location: ''
          skip_app_build: true
          skip_api_build: true

      - name: Azure login (OIDC)
        if: success()
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Stamp the released version onto the Static Web App as a resource tag
      # (merge = keep the infra-managed tags).
      - name: Tag Static Web App with version
        if: success()
        env:
          SWA: ${{ vars.AZURE_STATIC_WEB_APP_NAME || 'swa-arunsudi-prod' }}
          RG: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-portfolio-prod' }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          rid="$(az staticwebapp show -n "$SWA" -g "$RG" --query id -o tsv)"
          az tag update --resource-id "$rid" --operation merge --tags version="$VERSION"

      # Persist the bump only after a successful deploy. [skip ci] stops this
      # commit from re-triggering the workflow.
      - name: Commit version bump and tag
        if: success()
        run: |
          v="${{ steps.ver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Discard the build-time key injection so it isn't committed and
          # doesn't block the rebase.
          git checkout -- src/environments/environment.prod.ts
          git add package.json package-lock.json
          git commit -m "chore(release): ui v$v [skip ci]"
          # Drop any other build-generated changes to tracked files so the
          # rebase always starts from a clean tree.
          git checkout -- .
          git pull --rebase origin main
          git tag -a "ui-v$v" -m "ui v$v"
          git push --follow-tags origin HEAD:main
