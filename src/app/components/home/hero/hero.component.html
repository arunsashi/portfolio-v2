@let p = profile();
<section id="hero" class="container-page pt-14 pb-8" aria-labelledby="hero-heading">
  @if (p) {
    <div class="grid items-stretch gap-8 md:grid-cols-[340px_1fr]">
      <!-- Portrait card (yellow neo-brutalist frame) -->
      <div
        appReveal="left"
        class="group hover-lift rounded-xl border-4 border-line bg-accent-yellow p-3 shadow-hard-lg rotate-2 hover:rotate-0 transition-transform duration-300 ease-out"
      >
        <div class="aspect-square w-full overflow-hidden rounded-lg border-2 border-line bg-canvas">
          @if (p.photoUrl) {
            <img
              [src]="p.photoUrl"
              [alt]="p.name + ' portrait'"
              class="h-full w-full object-contain scale-100 saturate-[1.4] contrast-[1.1] brightness-[1.05] sepia-[0.15] hue-rotate-[-5deg] transition-transform duration-700 ease-out group-hover:scale-[1.12]"
            />
          } @else {
            <div class="grid h-full w-full place-items-center text-5xl font-bold text-ink">
              {{ initials(p.name) }}
            </div>
          }
        </div>
      </div>

      <!-- Intro card -->
      <div
        appReveal="right"
        class="relative rounded-xl border-4 border-line bg-[var(--color-accent-skyblue)] p-8 shadow-hard-lg sm:p-10"
      >
        <h1 id="hero-heading" class="text-4xl font-black uppercase leading-[1.05] text-ink sm:text-5xl">
          Hey, I'm Arun Sudi.<br />Software
          <span class="underline decoration-4 underline-offset-4 text-accent-deep-magenta"
            >Engineer.</span
          >
        </h1>
        <p class="mt-5 inline-flex items-center gap-2 text-lg font-semibold text-ink">
          <i class="fa-solid fa-briefcase text-ink" aria-hidden="true"></i> {{ p.role }}
        </p>
        <div class="mt-7 flex flex-wrap items-center gap-4">
          <app-hire-me-modal />
          <p class="inline-flex items-center gap-2 rounded-md border-2 border-line bg-surface px-4 py-3 text-sm text-ink">
            <i class="fa-solid fa-plane text-ink" aria-hidden="true"></i> {{ p.funFact }}
          </p>
        </div>
      </div>
    </div>
  }
</section>
