<div
  class="relative left-1/2 my-4 w-screen -translate-x-1/2 rotate-1 overflow-hidden border-y-4 border-line bg-accent-yellow shadow-hard-under"
  role="group"
  aria-label="What I'm reading — auto-scrolling latest news; drag or scroll to browse, click any item to read more"
>
  <!-- pinned label: a full-width strip above the row on mobile (overlaying
       would swallow the narrow ticker); a side sticker the stories scroll
       past from sm up -->
  <span
    class="z-10 flex items-center gap-2 border-b-4 border-line bg-accent-pink px-4 py-2 font-mono text-xs font-bold uppercase tracking-wide text-ink sm:absolute sm:inset-y-0 sm:left-0 sm:border-b-0 sm:border-r-4 sm:py-0"
  >
    <span class="relative flex h-2.5 w-2.5" aria-hidden="true">
      <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-accent-neon-green opacity-75 motion-reduce:animate-none"></span>
      <span class="relative inline-flex h-2.5 w-2.5 rounded-full bg-accent-neon-green"></span>
    </span>
    <span>What I'm reading &middot; updated daily</span>
  </span>

  <div
    appDragScroll
    appMarquee
    tabindex="0"
    class="flex select-none overflow-x-auto py-5 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"
  >
    <div class="flex w-max">
      @for (loop of [0, 1]; track loop) {
        <ul class="flex shrink-0 items-center" [attr.aria-hidden]="loop === 1 ? 'true' : null">
          @for (item of items(); track item.id) {
            <li class="flex items-center whitespace-nowrap">
              <a
                routerLink="/news"
                [queryParams]="{ cat: item.category, item: item.id }"
                class="flex items-center gap-3 px-8 text-xl font-black uppercase tracking-wide text-ink hover:text-brand focus:outline-none focus-visible:underline"
              >
                <i [class]="iconFor(item.category) + ' text-brand'" aria-hidden="true"></i>
                {{ item.tickerLabel }}
              </a>
              <span class="text-2xl text-ink/20" aria-hidden="true">•</span>
            </li>
          }
        </ul>
      }
    </div>
  </div>
</div>
